                :root {

                    line-height: 1.5;
                    color: rgb(200 200 200);
                    background-color: rgb(50 50 50);
                }
                * {
                    box-sizing: border-box;
                    margin: 0;
                    padding: 0;
                    list-style: none;
                }
                aside nav h1 {
                    color: rgb(150 150 150);
                    font-size: 1.5rem;
                    font-weight: bold;
                    text-transform: uppercase;
                }
                aside nav h2 {
                    color: rgb(100 100 100);
                    font-size: 1.25;
                    font-weight: bold;
                    text-transform: capitalize;
                }
                aside nav li {
                    width: 100%;
                    padding: 8px;
                }
                aside {
                    width: 200px;
                }

                h1 {
                    text-transform:uppercase;
                }

                h2 {
                    text-transform: capitalize;
                }

                .wip {
                    position: relative;
                }

                .wip::before {
                    content: "";
                    position: absolute;
                    inset: 0;
                    z-index: 1;
                    background: rgb(255 255 255 / 45%);
                    pointer-events: none;
                }

                .wip::after {
                    content: "Work in progress";
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    z-index: 2;
                    transform: translate(-50%, -50%);
                    padding: 0.6rem 1rem;
                    border-radius: 0.3rem;
                    background:rgba(20 20 20 / 0.2);
                    color: white;
                    font-weight: bold;
                    white-space: nowrap;
                    pointer-events: none;
                }
            </style>
        </head>
